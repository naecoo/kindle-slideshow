<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Slideshow</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body onload="init()">

    <!-- Fullscreen photo stage -->
    <div id="stage">
        <img id="slide" alt="" />
    </div>

    <!-- Bookmark = settings handle (revealed by tapping the screen) -->
    <button id="bookmark" type="button" aria-label="Open settings" aria-expanded="false">
        <span class="ribbon"></span>
    </button>

    <!-- Settings popover -->
    <div id="backdrop" class="hidden"></div>
    <div id="settings" class="hidden" role="dialog" aria-label="Settings">
        <div class="head">
            <div class="eyebrow">SLIDESHOW</div>
            <h1 data-i18n="settings.title">Settings</h1>
        </div>

        <div class="row">
            <span class="label" data-i18n="interval">Interval</span>
            <div class="stepper">
                <button id="iv-minus" type="button" aria-label="decrease interval">−</button>
                <span id="iv-value" class="value">10 s</span>
                <button id="iv-plus" type="button" aria-label="increase interval">+</button>
            </div>
        </div>

        <div class="row">
            <span class="label" data-i18n="presets">Presets</span>
            <div id="presets" class="presets">
                <button type="button" data-iv="5">5</button>
                <button type="button" data-iv="10">10</button>
                <button type="button" data-iv="15">15</button>
                <button type="button" data-iv="30">30</button>
                <button type="button" data-iv="60">60</button>
            </div>
        </div>

        <div class="row">
            <span class="label" data-i18n="shuffle">Shuffle</span>
            <button id="shuffle-btn" class="toggle" type="button" aria-pressed="false">Off</button>
        </div>

        <div class="row col">
            <label class="label" for="dir-input" data-i18n="folder">Image folder</label>
            <input id="dir-input" type="text" spellcheck="false" autocomplete="off" />
        </div>

        <div class="row">
            <span class="label" data-i18n="lang.label">Language</span>
            <div class="lang-seg" id="lang-toggle">
                <button type="button" data-lang="en">EN</button>
                <button type="button" data-lang="zh">中文</button>
            </div>
        </div>

        <div id="status">Scanning image list…</div>

        <div class="actions">
            <button id="refresh-btn" type="button" data-i18n="refresh">Refresh list</button>
            <button id="exit-btn" type="button" data-i18n="exit">Exit app</button>
        </div>

        <div class="foot" data-i18n="foot">Tap outside to close · swipe to change image</div>
    </div>

    <script src="i18n.js"></script>
    <script src="main.js"></script>
</body>
</html>
